name: Claude Code

# Lets contributors and maintainers mention @claude in an issue or PR to have
# Claude triage, answer, review, or implement changes.
#
# AUTH — uses a Claude Pro/Max subscription (no metered API cost): run
# `claude setup-token` locally and add the result as the CLAUDE_CODE_OAUTH_TOKEN
# repository secret. (To use metered API billing instead, replace the
# claude_code_oauth_token input with `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}`.)
#
# Workflow permissions are read-only; the installed Claude GitHub App provides the
# write access for commenting/committing. Actions are SHA-pinned (Dependabot updates them).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read # lets Claude read CI results on PRs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Lets Claude read CI results when responding on PRs.
          additional_permissions: |
            actions: read
