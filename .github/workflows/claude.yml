name: Claude

# Lets contributors and maintainers mention @claude in an issue or PR to have
# Claude triage, answer, propose fixes, or open pull requests.
#
# SETUP (maintainer, one-time) — uses a Claude Pro/Max subscription, NOT metered API
# billing, so it adds no extra cost (it draws from your plan's usage allowance):
#   1. Run `claude setup-token` locally (requires an active Pro/Max subscription).
#   2. Add the generated token as a repository secret named CLAUDE_CODE_OAUTH_TOKEN.
# Without the secret this workflow is a no-op.
#
# (Alternatively, swap `claude_code_oauth_token` below for
#  `anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}` to use metered API billing.)

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened]

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 1

      - name: Run Claude Code
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251 # v1
        with:
          # Default: authenticate with a Claude Pro/Max subscription (no metered cost).
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Fallback: switch to metered API billing instead — comment out the line
          # above, uncomment the line below, and add an ANTHROPIC_API_KEY repo secret.
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
