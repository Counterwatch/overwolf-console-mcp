name: Release

# Publishes to npm automatically when you publish a GitHub Release.
# Flow: bump the version (`npm version patch|minor|major`) -> push the tag
# (`git push --follow-tags`) -> create a GitHub Release for that tag. This runs.
#
# AUTH — pick ONE (one-time maintainer setup):
#   A) npm Trusted Publishing (recommended, no stored secret): at npmjs.com, open the
#      package's Settings -> Publishing access and add this repo + the "Release"
#      workflow as a Trusted Publisher. OIDC is then used automatically (needs the
#      `id-token: write` permission below). The package must already exist on npm,
#      so do the FIRST publish manually (`npm publish --access public`), then enable.
#   B) Automation token: create a granular npm "Automation" access token and add it as
#      the `NPM_TOKEN` repository secret. This works for the first publish too.

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # required for npm provenance + Trusted Publishing (OIDC)

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      # Ensure an npm new enough for OIDC Trusted Publishing (>= 11.5.1). Harmless if
      # you use NPM_TOKEN instead.
      - run: npm install -g npm@latest

      - run: npm ci

      - name: Verify before publishing
        run: npm run build && npm test && npm run smoke

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          # Ignored when Trusted Publishing (OIDC) is configured; used otherwise.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
